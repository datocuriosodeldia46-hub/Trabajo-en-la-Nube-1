<canvas id="c" width="1920" height="1080"></canvas>

<script type="module">
// Three coins. One plush. — a 20 s character film, one HTML file.
// Every frame is a pure function of time: renderAt(t) samples a seeded cannon-es bake
// that runs once at load. ?t=12.2 draws a single time and stops; ?sub=N averages N
// sub-frames per frame (motion blur + anti-aliasing) for the offline render.
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const Q = new URLSearchParams(location.search);
const W = 1920, HGT = 1080, FPS = 60, DUR = 20;
let SUB = +(Q.get('sub') ?? 1);
const SHUTTER = 0.45;                         // fraction of a frame the shutter is open

// ───────────────────────────── utilities ─────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * u * (u * (u * 6 - 15) + 10); };
const win = (t, a, b, c, d) => ss(a, b, t) * (1 - ss(c, d, t));
const ring = (t, t0, f, d) => t < t0 ? 0 : Math.exp(-d * (t - t0)) * Math.sin(2 * Math.PI * f * (t - t0));
const backOut = (u, s = 1.6) => { u = clamp(u) - 1; return u * u * ((s + 1) * u + s) + 1; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// Time spline: monotone cubic Hermite per dimension, so holds stay still and nothing overshoots.
function spline(keys) {
  const n = keys.length, T = keys.map(k => k[0]), V = keys.map(k => k.slice(1)), D = V[0].length;
  const M = V.map((v, i) => v.map((_, d) => {
    if (i === 0 || i === n - 1) return 0;
    const a = (V[i][d] - V[i - 1][d]) / (T[i] - T[i - 1]), b = (V[i + 1][d] - V[i][d]) / (T[i + 1] - T[i]);
    if (a * b <= 0) return 0;
    return 3 * (T[i + 1] - T[i - 1]) / ((2 * T[i + 1] - T[i] - T[i - 1]) / a + (T[i + 1] + T[i] - 2 * T[i - 1]) / b);
  }));
  return (t) => {
    if (t <= T[0]) return V[0].slice();
    if (t >= T[n - 1]) return V[n - 1].slice();
    let i = 0; while (t > T[i + 1]) i++;
    const h = T[i + 1] - T[i], u = (t - T[i]) / h, u2 = u * u, u3 = u2 * u;
    const a = 2 * u3 - 3 * u2 + 1, b = u3 - 2 * u2 + u, c = -2 * u3 + 3 * u2, e = u3 - u2;
    const out = new Array(D);
    for (let d = 0; d < D; d++) out[d] = a * V[i][d] + b * h * M[i][d] + c * V[i + 1][d] + e * h * M[i + 1][d];
    return out;
  };
}

// ───────────────────────────── palette & brand ─────────────────────────────
// BRAND: hero D97757, prizes in F3E6CF 8DBFAF F2C14E E8A6B4 7FA7D9 + one orange, teal cabinet 1F6F6B.
const PAL = { hero: 0xD97757, cream: 0xF3E6CF, sage: 0x8DBFAF, yellow: 0xF2C14E, pink: 0xE8A6B4, blue: 0x7FA7D9, teal: 0x1F6F6B, eye: 0x0F0F0F };
const H = 0.035;           // one hero pixel (m)
const P = 0.36 * H;        // one plush pixel
const PILLOW = 0.35;        // how much a plush bulges front/back

// ───────────────────────────── voxel geometry ─────────────────────────────
// Chamfered cubes, emitting only faces/edges/corners that touch air, so neighbours
// read as separate soft blocks with a groove between them.
function voxGeo(cells, s, bev, origin = [0, 0, 0], deform = null) {
  const key = (i, j, k) => ((i + 256) * 512 + (j + 256)) * 512 + (k + 256);
  const S = new Set(cells.map(([i, j, k]) => key(i, j, k)));
  const pos = [], h = s / 2, e = h - bev;
  const emit = (pts, n) => {
    const [a, b, c] = pts;
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    if ((uy * vz - uz * vy) * n[0] + (uz * vx - ux * vz) * n[1] + (ux * vy - uy * vx) * n[2] < 0) pts = pts.slice().reverse();
    if (pts.length === 3) pos.push(...pts[0], ...pts[1], ...pts[2]);
    else pos.push(...pts[0], ...pts[1], ...pts[2], ...pts[0], ...pts[2], ...pts[3]);
  };
  for (const ijk of cells) {
    const c = [origin[0] + (ijk[0] + .5) * s, origin[1] + (ijk[1] + .5) * s, origin[2] + (ijk[2] + .5) * s];
    const nb = (ax, sg) => { const q = ijk.slice(); q[ax] += sg; return S.has(key(q[0], q[1], q[2])); };
    const nb2 = (a1, s1, a2, s2) => { const q = ijk.slice(); q[a1] += s1; q[a2] += s2; return S.has(key(q[0], q[1], q[2])); };
    const Vt = (a) => [c[0] + a[0], c[1] + a[1], c[2] + a[2]];
    // a voxel on a concave edge is emitted whole so the inside corner stays closed
    let full = false;
    for (let a1 = 0; a1 < 3; a1++) for (let a2 = a1 + 1; a2 < 3; a2++) for (const s1 of [-1, 1]) for (const s2 of [-1, 1])
      if (nb(a1, s1) && nb(a2, s2) && !nb2(a1, s1, a2, s2)) full = true;
    for (let ax = 0; ax < 3; ax++) for (const sg of [-1, 1]) {
      if (!full && nb(ax, sg)) continue;
      const a1 = (ax + 1) % 3, a2 = (ax + 2) % 3, pts = [];
      for (const [p, q] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { const v = [0, 0, 0]; v[ax] = sg * h; v[a1] = p * e; v[a2] = q * e; pts.push(Vt(v)); }
      const n = [0, 0, 0]; n[ax] = sg; emit(pts, n);
    }
    for (let ax1 = 0; ax1 < 3; ax1++) for (let ax2 = ax1 + 1; ax2 < 3; ax2++) {
      const ax3 = 3 - ax1 - ax2;
      for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
        if (!full && nb(ax1, s1) && nb(ax2, s2)) continue;
        const pts = [];
        for (const [w, t3] of [[0, -1], [0, 1], [1, 1], [1, -1]]) {
          const v = [0, 0, 0]; v[ax3] = t3 * e;
          if (w === 0) { v[ax1] = s1 * h; v[ax2] = s2 * e; } else { v[ax1] = s1 * e; v[ax2] = s2 * h; }
          pts.push(Vt(v));
        }
        const n = [0, 0, 0]; n[ax1] = s1; n[ax2] = s2; emit(pts, n);
      }
    }
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
      const sg = [sx, sy, sz];
      // fill the little diamond where four grooves meet on a flat face
      for (let a = 0; a < 3; a++) {
        const b = (a + 1) % 3, cc = (a + 2) % 3;
        if (nb(a, sg[a]) || !nb(b, sg[b]) || !nb(cc, sg[cc]) || !nb2(b, sg[b], cc, sg[cc])) continue;
        const v1 = [0, 0, 0], v2 = [0, 0, 0], v3 = [0, 0, 0];
        v1[a] = v2[a] = v3[a] = sg[a] * e;
        v1[b] = sg[b] * h; v1[cc] = sg[cc] * e; v2[b] = sg[b] * e; v2[cc] = sg[cc] * h; v3[b] = sg[b] * h; v3[cc] = sg[cc] * h;
        const n = [0, 0, 0]; n[a] = sg[a]; emit([Vt(v1), Vt(v2), Vt(v3)], n);
      }
      if (!full && nb(0, sx) && nb(1, sy) && nb(2, sz)) continue;
      const pts = [];
      for (let ax = 0; ax < 3; ax++) { const v = [sx * e, sy * e, sz * e]; v[ax] = sg[ax] * h; pts.push(Vt(v)); }
      emit(pts, sg);
    }
  }
  if (deform) for (let i = 0; i < pos.length; i += 3) { const p = deform(pos[i], pos[i + 1], pos[i + 2]); pos[i] = p[0]; pos[i + 1] = p[1]; pos[i + 2] = p[2]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals(); g.computeBoundingBox();
  return g;
}

// The mascot as a 20×13 pixel grid: body 14×10 at (3,0), arms 3×2 at (0,5) and (17,5),
// legs 2×3 at x 4,7,11,14 on row 10, eyes 2×3 at (6,3) and (12,3). Column c → i=c-10, row r → j=12-r.
function mascotCells(dBody, dLimb, extraTop = 0) {
  const out = { body: [], armA: [], armB: [], legs: [[], [], [], []] };
  const kb = -dBody / 2, kl = -dLimb / 2;
  for (let r = 0; r <= 9; r++) for (let c = 3; c <= 16; c++) for (let k = 0; k < dBody; k++) out.body.push([c - 10, 12 - r, kb + k]);
  for (let r = 5; r <= 6; r++) for (let k = 0; k < dLimb; k++) {
    for (let c = 0; c <= 2; c++) out.armA.push([c - 10, 12 - r, kl + k]);
    for (let c = 17; c <= 19; c++) out.armB.push([c - 10, 12 - r, kl + k]);
  }
  [[4, 5], [7, 8], [11, 12], [14, 15]].forEach((cs, li) => {
    for (let r = 10; r <= 12; r++) for (const c of cs) for (let k = 0; k < dLimb; k++) out.legs[li].push([c - 10, 12 - r, kl + k]);
  });
  return out;
}

// ───────────────────────────── renderer & targets ─────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, HGT, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(38, W / HGT, 0.012, 40);

const std = (color, rough = 0.6, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const basic = (r, g, b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });
const hdr = (hex, k) => { const c = new THREE.Color(hex); return new THREE.MeshBasicMaterial({ color: new THREE.Color(c.r * k, c.g * k, c.b * k) }); };

// Shadow-only registry for QA: every solid gets an oriented box.
const SOLIDS = [];
function addSolid(name, obj, box, kind) { SOLIDS.push({ name, obj, box, kind }); }

// ───────────────────────────── room & arcade ─────────────────────────────
function canvasTex(w, h, draw, nearest = false) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }
  else t.anisotropy = 4;
  return t;
}
const hexs = ['#D97757', '#F3E6CF', '#8DBFAF', '#F2C14E', '#E8A6B4', '#7FA7D9'];

function buildRoom() {
  const R = rng(7);
  const carpet = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#10142a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 520; i++) {
      g.save(); g.translate(R() * w, R() * h); g.rotate(R() * 6.3);
      g.fillStyle = ['#1f6f6b', '#3b2a5c', '#7FA7D9', '#E8A6B4', '#F2C14E', '#8DBFAF'][Math.floor(R() * 6)];
      g.globalAlpha = 0.35 + R() * 0.35;
      const k = R(); const s = 8 + R() * 18;
      if (k < .35) g.fillRect(-s / 2, -s / 6, s, s / 3);
      else if (k < .65) { g.beginPath(); g.moveTo(0, -s / 2); g.lineTo(s / 2, s / 2); g.lineTo(-s / 2, s / 2); g.fill(); }
      else { g.beginPath(); g.arc(0, 0, s / 3, 0, 6.3); g.fill(); }
      g.restore();
    }
  });
  carpet.wrapS = carpet.wrapT = THREE.RepeatWrapping; carpet.repeat.set(5, 5);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), std(0xffffff, 0.94, 0, { map: carpet }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  addSolid('floor', floor, new THREE.Box3(V3(-8, -8, -0.2), V3(8, 8, 0)), 'static');

  const wallM = std(0x1a1526, 0.9);
  for (const [x, z, ry] of [[0, -5.5, 0], [0, 5.5, Math.PI], [-5.5, 0, Math.PI / 2], [5.5, 0, -Math.PI / 2]]) {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.4), wallM); wall.position.set(x, 1.7, z); wall.rotation.y = ry; scene.add(wall);
  }
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(11, 11), std(0x07060a, 1)); ceil.position.y = 3.4; ceil.rotation.x = Math.PI / 2; scene.add(ceil);
  // neon strips along the walls
  const neon = [[0x7FA7D9, 3.5], [0xE8A6B4, 3.2], [0x8DBFAF, 3.0], [0xF2C14E, 2.6]];
  [[0, -5.45, 0], [0, 5.45, 0], [-5.45, 0, Math.PI / 2], [5.45, 0, Math.PI / 2]].forEach(([x, z, ry], i) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(10.5, 0.035, 0.035), hdr(neon[i][0], neon[i][1]));
    m.position.set(x, 2.55, z); m.rotation.y = ry; scene.add(m);
    const m2 = m.clone(); m2.position.y = 0.32; m2.material = hdr(neon[(i + 2) % 4][0], 1.6); scene.add(m2);
  });
  // ceiling light panels (soft overhead blobs for the bokeh)
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.5), hdr(0xfff1dc, 2.2));
    m.position.set(-4 + (i % 5) * 2, 3.38, i < 5 ? -1.6 : 2.4); scene.add(m);
  }
  // arcade cabinets all around
  const spots = [
    [-2.3, -2.6, 0.25], [-1.25, -2.9, 0.08], [1.2, -2.9, -0.08], [2.3, -2.5, -0.3], [0.0, -3.4, 0],
    [-3.3, -0.6, 1.2], [3.3, -0.3, -1.25], [-3.2, 1.4, 1.7], [3.2, 1.6, -1.8],
    [-2.0, 3.3, Math.PI - 0.3], [-0.6, 3.6, Math.PI - 0.06], [0.9, 3.5, Math.PI + 0.1], [2.2, 3.1, Math.PI + 0.35],
  ];
  spots.forEach(([x, z, ry], i) => scene.add(arcadeCab(x, z, ry, i)));
}

function arcadeCab(x, z, ry, i) {
  const R = rng(100 + i);
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.78, 1.66, 0.74), std([0x1b1f33, 0x231a30, 0x16232b][i % 3], 0.55));
  body.position.y = 0.83; g.add(body);
  const scr = canvasTex(64, 48, (c, w, h) => {
    c.fillStyle = '#05070c'; c.fillRect(0, 0, w, h);
    for (let n = 0; n < 70; n++) { c.fillStyle = hexs[Math.floor(R() * 6)]; const s = 2 + Math.floor(R() * 5); c.fillRect(Math.floor(R() * w), Math.floor(R() * h), s, s); }
  }, true);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.46), new THREE.MeshBasicMaterial({ map: scr, color: new THREE.Color(2.4, 2.4, 2.4) }));
  screen.position.set(0, 1.27, 0.372); screen.rotation.x = -0.16; g.add(screen);
  const mq = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.22, 0.2), hdr(['#F2C14E', '#8DBFAF', '#E8A6B4', '#7FA7D9'][i % 4], 2.6));
  mq.position.set(0, 1.77, 0.28); g.add(mq);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.34), std(0x2a2f45, 0.5));
  deck.position.set(0, 0.98, 0.47); deck.rotation.x = 0.2; g.add(deck);
  for (let b = 0; b < 4; b++) {
    const btn = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), hdr(hexs[(b + i) % 6], 4));
    btn.position.set(-0.18 + b * 0.12, 1.02, 0.5); g.add(btn);
  }
  for (const sx of [-1, 1]) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.015, 1.5, 0.015), hdr(hexs[(i + 2) % 6], 3));
    st.position.set(sx * 0.395, 0.85, 0.375); g.add(st);
  }
  g.position.set(x, 0, z); g.rotation.y = ry;
  return g;
}

// ───────────────────────────── the claw machine ─────────────────────────────
const MC = {
  hw: 0.65, zf: 0.45, zb: -0.50, pf: 0.75, gTop: 1.65, boxTop: 1.85, mq0: 1.86, mq1: 2.18,
  ix0: -0.60, ix1: 0.60, iz0: -0.45, iz1: 0.416, glassZ: 0.42,
  chX0: -0.60, chX1: -0.18, chZ0: 0.0, rail: 0.955, gantryY: 1.60,
  flX0: -0.58, flX1: -0.20, flY0: 0.05, flY1: 0.40,
  panelZ1: 0.60,
};
// the hero stands on a tall step stool so its face clears the pile; the controls sit right under its stubby arms
const HERO0 = { x: 0.20, y: 0.86, z: MC.panelZ1 + 0.01 + 3 * H };
MC.panelY1 = HERO0.y + 6 * H - 0.156; MC.panelY0 = MC.panelY1 - 0.04; MC.panelX0 = HERO0.x - 0.32; MC.panelX1 = HERO0.x + 0.36;
const JOY = V3(HERO0.x + 8.5 * H, MC.panelY1, HERO0.z - 4.3 * H), BTN = V3(HERO0.x - 8.5 * H, MC.panelY1, HERO0.z - 4.3 * H);
const SLOT = V3(HERO0.x, MC.panelY1 + 0.085, 0.50), STACK = V3(HERO0.x - 4 * H, MC.panelY1, HERO0.z - 4.6 * H);
const FLAP_HINGE = { y: 0.40, z: 0.437 };

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.solver.iterations = 24; world.solver.tolerance = 1e-4;
world.allowSleep = true;
const G = { STATIC: 1, PLUSH: 2, STORY: 4, CLAW: 8, KEEP: 16, KEEPF: 32 };
const physMat = new CANNON.Material('m');
world.addContactMaterial(new CANNON.ContactMaterial(physMat, physMat, { friction: 0.6, restitution: 0.04, contactEquationStiffness: 1e7, contactEquationRelaxation: 3 }));
world.defaultContactMaterial.friction = 0.6; world.defaultContactMaterial.restitution = 0.04;

function staticBox(x0, x1, y0, y1, z0, z1, group = G.STATIC, mask = G.PLUSH | G.STORY, rot = null) {
  const b = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC, material: physMat, collisionFilterGroup: group, collisionFilterMask: mask });
  b.addShape(new CANNON.Box(new CANNON.Vec3((x1 - x0) / 2, (y1 - y0) / 2, (z1 - z0) / 2)));
  b.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  if (rot) b.quaternion.setFromEuler(rot[0], rot[1], rot[2]);
  world.addBody(b); return b;
}
// Visible solid box + physics + QA box in one call.
function block(name, x0, x1, y0, y1, z0, z1, mat, { phys = true, vis = true, qa = true, shadow = true, parent = scene } = {}) {
  let m = null;
  if (vis) {
    m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    m.castShadow = shadow; m.receiveShadow = true; parent.add(m);
  }
  if (phys) staticBox(x0, x1, y0, y1, z0, z1);
  if (qa) {
    const o = m || new THREE.Object3D(); if (!m) { o.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); scene.add(o); }
    const hx = (x1 - x0) / 2, hy = (y1 - y0) / 2, hz = (z1 - z0) / 2;
    addSolid(name, o, new THREE.Box3(V3(-hx, -hy, -hz), V3(hx, hy, hz)), 'static');
  }
  return m;
}

const MAT = {};
function buildMachine() {
  MAT.teal = std(PAL.teal, 0.42, 0.05);

const GLASS = { hitT: 9.20, hit: V3(0.22, 1.12, 0.424), envOut: null, envIn: null };
function glassMaterials(envTexOut, envTexIn) {
  const common = `
    uniform float uT, uHitT; uniform vec3 uHit;
    varying vec3 vW; varying vec3 vN; varying float vBump;
    float flex(vec3 p){ float dt=uT-uHitT; if(dt<0.0) return 0.0; float r=length(p.xy-uHit.xy);
      return -0.010*exp(-dt*5.5)*cos(6.2831*8.5*dt)*exp(-r*r/0.035); }`;
  const vert = `${common}
    void main(){ vec3 p=position; vec4 w=modelMatrix*vec4(p,1.0);
      float f = (abs(normal.z)>0.5) ? flex(w.xyz) : 0.0; w.z += f; vBump=f/0.010;
      vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`;
  const fogFn = `float smudge(vec3 p){ float dt=uT-uHitT; if(dt<0.0) return 0.0;
      vec2 d=(p.xy-uHit.xy)/vec2(0.034,0.026); float r=dot(d,d);
      float n = 0.75+0.25*sin(p.x*410.0+p.y*170.0)*sin(p.y*380.0-p.x*90.0);
      return exp(-r)*n*smoothstep(0.0,0.05,dt)*exp(-max(dt-0.3,0.0)*0.55); }`;
  const tint = new THREE.ShaderMaterial({
    uniforms: { uT: { value: 0 }, uHitT: { value: GLASS.hitT }, uHit: { value: GLASS.hit } },
    vertexShader: vert,
    fragmentShader: `${common}${fogFn}
      void main(){ float b=abs(vBump); vec3 tint=vec3(0.90,0.955,0.95)*(1.0-0.10*b) + vec3(0.0,0.02,0.015)*b;
        tint *= 1.0-0.18*smudge(vW); gl_FragColor=vec4(tint,1.0); }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.ZeroFactor, blendDst: THREE.SrcColorFactor, blendEquation: THREE.AddEquation,
  });
  const refl = (env, sideSign, gain) => new THREE.ShaderMaterial({
    uniforms: { uT: { value: 0 }, uHitT: { value: GLASS.hitT }, uHit: { value: GLASS.hit }, uEnv: { value: env }, uGain: { value: gain }, uSmudge: { value: 1 } },
    vertexShader: vert,
    fragmentShader: `${common}${fogFn}
      uniform samplerCube uEnv; uniform float uGain, uSmudge;
      void main(){ vec3 V=normalize(vW-cameraPosition); vec3 N=normalize(vN); if(dot(N,V)>0.0) N=-N;
        // flex wobbles the normal so the reflection ripples on the bonk
        N = normalize(N + vec3(0.0, 0.0, 0.0) + 0.6*vBump*vec3(sin(vW.x*40.0), cos(vW.y*40.0), 0.0));
        float c=clamp(1.0+dot(V,N),0.0,1.0); float F=0.04+0.96*pow(c,5.0);
        vec3 R=reflect(V,N); vec3 env=textureCube(uEnv, vec3(-R.x,R.y,R.z)).rgb;
        float s=smudge(vW)*uSmudge;
        gl_FragColor=vec4(env*F*uGain + vec3(0.85,0.9,0.95)*s*0.16, 1.0); }`,
    transparent: true, depthWrite: false, side: sideSign > 0 ? THREE.FrontSide : THREE.BackSide,
    blending: THREE.AdditiveBlending,
  });
  return { tint, out: refl(envTexOut, 1, 1.0), inn: refl(envTexIn, -1, 0.8) };
}
