<script type="module">
// "Lucas": a 35 s vertical short. Every frame is a pure function of time: renderAt(t).
// Paseo de la Reforma at night, a delivery rider, a truck, and the airbag vest in X-ray.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const W = 1080, HGT = 1920, FPS = 30;
let SUB = +(Q.get('sub') ?? 1);
const SHUTTER = 0.5;

// ───────────────────────────── utilities ─────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * u * (u * (u * 6 - 15) + 10); };
const win = (t, a, b, c, d) => ss(a, b, t) * (1 - ss(c, d, t));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const std = (color, rough = 0.6, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const hdr = (hex, k) => { const c = new THREE.Color(hex); return new THREE.MeshBasicMaterial({ color: new THREE.Color(c.r * k, c.g * k, c.b * k) }); };
const rbox = (w, h, d, r = 0.05, seg = 3) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3));
function mesh(geo, mat, parent, pos = [0, 0, 0], rot = [0, 0, 0], shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = shadow; m.receiveShadow = true; if (parent) parent.add(m); return m;
}
function spline(keys) {   // monotone cubic in time per dimension
  const n = keys.length, T = keys.map(k => k[0]), V = keys.map(k => k.slice(1)), D = V[0].length;
  const M = V.map((v, i) => v.map((_, d) => {
    if (i === 0 || i === n - 1) return 0;
    const a = (V[i][d] - V[i - 1][d]) / (T[i] - T[i - 1]), b = (V[i + 1][d] - V[i][d]) / (T[i + 1] - T[i]);
    if (a * b <= 0) return 0;
    return 3 * (T[i + 1] - T[i - 1]) / ((2 * T[i + 1] - T[i] - T[i - 1]) / a + (T[i + 1] + T[i] - 2 * T[i - 1]) / b);
  }));
  return (t) => {
    if (t <= T[0]) return V[0].slice(); if (t >= T[n - 1]) return V[n - 1].slice();
    let i = 0; while (t > T[i + 1]) i++;
    const h = T[i + 1] - T[i], u = (t - T[i]) / h, u2 = u * u, u3 = u2 * u;
    const a = 2 * u3 - 3 * u2 + 1, b = u3 - 2 * u2 + u, c = -2 * u3 + 3 * u2, e = u3 - u2;
    return V[i].map((_, d) => a * V[i][d] + b * h * M[i][d] + c * V[i + 1][d] + e * h * M[i + 1][d]);
  };
}
function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ───────────────────────────── renderer ─────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, HGT, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / HGT, 0.05, 900);

// ───────────────────────────── the X-ray look ─────────────────────────────
// A Fresnel hologram: bright green rims, faint fill, additive — the signature of the genre.
const XRAY = [];
function xrayMat(strength = 1, color = [0.35, 1.0, 0.62]) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uK: { value: 0 }, uS: { value: strength }, uC: { value: new THREE.Vector3(...color) } },
    vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vN=normalize(mat3(modelMatrix)*normal); vV=normalize(cameraPosition-w.xyz); gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform float uK, uS; uniform vec3 uC; varying vec3 vN; varying vec3 vV;
      void main(){ float f=1.0-abs(dot(normalize(vN),normalize(vV))); float rim=pow(f,2.2);
        vec3 c=uC*(0.10+1.6*rim)*uS + vec3(0.8,1.0,0.9)*pow(f,7.0)*0.9*uS; gl_FragColor=vec4(c*uK,1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  XRAY.push(m); return m;
}
// Each part keeps its normal look and an X-ray twin that fades in while the "solid" fades out.
const DUAL = [];
function dual(mesh_, strength = 1) {
  const x = new THREE.Mesh(mesh_.geometry, xrayMat(strength)); x.castShadow = false; x.renderOrder = 20;
  mesh_.add(x); DUAL.push({ solid: mesh_, x });
  return mesh_;
}

// ───────────────────────────── the city: Paseo de la Reforma ─────────────────────────────
const ROAD = { half: 9.5, z0: 60, z1: -620 };
const ANGEL_Z = -300;
const LIGHTS_ROAD = [];   // positions of lamps/car lights → bokeh + wet-road streaks
function buildCity() {
  const R = rng(11);
  // wet asphalt: low roughness so the lights smear across it
  const asphaltTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#2a2c31'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = 30 + R() * 30; g.fillStyle = `rgb(${v},${v},${v + 4})`; g.fillRect(R() * w, R() * h, 1.5, 1.5); }
    for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(10,10,14,0.35)'; g.beginPath(); g.ellipse(R() * w, R() * h, 20 + R() * 60, 8 + R() * 30, R() * 3, 0, 7); g.fill(); }
  });
  asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping; asphaltTex.repeat.set(4, 140);
  const road = mesh(new THREE.PlaneGeometry(2 * ROAD.half, ROAD.z0 - ROAD.z1), std(0xffffff, 0.22, 0.0, { map: asphaltTex, envMapIntensity: 1.6 }), scene, [0, 0, (ROAD.z0 + ROAD.z1) / 2], [-Math.PI / 2, 0, 0], false);
  MAT.road = road.material;
  // lane markings
  const dash = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.15, 3), std(0xf2f2ee, 0.4, 0, { emissive: 0x222222 }), 600);
  const o = new THREE.Object3D(); let n = 0;
  for (const x of [-4.75, 0, 4.75]) for (let z = ROAD.z0; z > ROAD.z1 && n < 600; z -= 9) { o.position.set(x, 0.01, z); o.rotation.set(-Math.PI / 2, 0, 0); o.updateMatrix(); dash.setMatrixAt(n++, o.matrix); }
  dash.count = n; dash.receiveShadow = true; scene.add(dash);
  for (const x of [-ROAD.half + 0.3, ROAD.half - 0.3]) mesh(new THREE.PlaneGeometry(0.14, ROAD.z0 - ROAD.z1), std(0xf2c94e, 0.5), scene, [x, 0.012, (ROAD.z0 + ROAD.z1) / 2], [-Math.PI / 2, 0, 0], false);
  // sidewalks and the tree-lined lateral strips of Reforma
  for (const s of [-1, 1]) {
    mesh(new THREE.BoxGeometry(9, 0.18, ROAD.z0 - ROAD.z1), std(0x3a3a3e, 0.8), scene, [s * (ROAD.half + 4.5), 0.09, (ROAD.z0 + ROAD.z1) / 2], [0, 0, 0], false);
    mesh(new THREE.BoxGeometry(0.25, 0.2, ROAD.z0 - ROAD.z1), std(0x8a8780, 0.6), scene, [s * (ROAD.half + 0.12), 0.1, (ROAD.z0 + ROAD.z1) / 2], [0, 0, 0], false);
  }
  // trees (ahuehuetes / fresnos)
  const trunkG = new THREE.CylinderGeometry(0.16, 0.24, 4, 7), leafG = new THREE.IcosahedronGeometry(1, 1);
  const trunks = new THREE.InstancedMesh(trunkG, std(0x2c2420, 0.9), 220), leaves = new THREE.InstancedMesh(leafG, std(0x1d3a24, 0.85), 660);
  let nt = 0, nl = 0;
  for (const s of [-1, 1]) for (let z = ROAD.z0 - 4; z > ROAD.z1; z -= 13 + R() * 4) {
    if (Math.abs(z - ANGEL_Z) < 40) continue;
    const x = s * (ROAD.half + 2.8 + R() * 1.2);
    o.position.set(x, 2, z); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1); o.updateMatrix(); trunks.setMatrixAt(nt++, o.matrix);
    for (let k = 0; k < 3; k++) { o.position.set(x + (R() - .5) * 1.6, 4.4 + R() * 1.6, z + (R() - .5) * 1.6); const sc = 1.3 + R() * 0.9; o.scale.set(sc, sc * 0.85, sc); o.updateMatrix(); leaves.setMatrixAt(nl++, o.matrix); }
  }
  trunks.count = nt; leaves.count = nl; trunks.castShadow = leaves.castShadow = true; scene.add(trunks, leaves);
  // street lamps (warm) — light pools come from a few real lights near the action
  const poleG = new THREE.CylinderGeometry(0.07, 0.1, 8, 8), headG = rbox(0.9, 0.18, 0.4, 0.06);
  const poleM = std(0x2a2d33, 0.5, 0.6), headM = hdr(0xffd9a0, 9);
  for (const s of [-1, 1]) for (let z = ROAD.z0; z > ROAD.z1; z -= 28) {
    if (Math.abs(z - ANGEL_Z) < 40) continue;
    const x = s * (ROAD.half + 1.0);
    mesh(poleG, poleM, scene, [x, 4, z], [0, 0, 0], false);
    mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 6), poleM, scene, [x - s * 0.8, 7.9, z], [0, 0, Math.PI / 2], false);
    mesh(headG, headM, scene, [x - s * 1.5, 7.85, z], [0, 0, 0], false);
    LIGHTS_ROAD.push({ p: V3(x - s * 1.5, 7.8, z), c: new THREE.Color(1.0, 0.82, 0.55), k: 1 });
  }
  // buildings: Reforma's towers, windows as emissive grids
  const winTex = [0, 1, 2].map(v => canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = '#0c0e14'; g.fillRect(0, 0, w, h);
    const cw = 32, ch = 34;   // one bay ≈ 3 m wide, one floor ≈ 3.2 m (repeat = size/48)
    for (let y = 6; y < h; y += ch) { const floorLit = R() < 0.75; for (let x = 4; x < w; x += cw) {
      const r = R(); if (!floorLit || r < 0.5) { g.fillStyle = '#141820'; g.fillRect(x, y, cw - 6, ch - 12); continue; }
      g.fillStyle = r < 0.8 ? `rgba(255,${200 + R() * 40 | 0},${130 + R() * 60 | 0},${0.5 + R() * 0.5})` : `rgba(${150 + R() * 60 | 0},${200 + R() * 40 | 0},255,${0.4 + R() * 0.5})`;
      g.fillRect(x, y, cw - 6, ch - 12);
    } }
  }));
  winTex.forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; });
  for (const s of [-1, 1]) for (let z = ROAD.z0 + 10; z > ROAD.z1 - 40;) {
    const wdt = 16 + R() * 18, dep = 14 + R() * 10, hgt = 18 + Math.pow(R(), 2) * 110;
    if (Math.abs(z - ANGEL_Z) < 45) { z -= 30; continue; }
    const tex = winTex[Math.floor(R() * 3)].clone(); tex.needsUpdate = true; tex.repeat.set(wdt / 48, hgt / 48);
    const m = std(0x1a1d26, 0.35, 0.3, { emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 1.4 + R() * 0.8 });
    const b = mesh(new THREE.BoxGeometry(dep, hgt, wdt), m, scene, [s * (ROAD.half + 9 + dep / 2 + R() * 3), hgt / 2, z - wdt / 2], [0, 0, 0], false);
    b.receiveShadow = false;
    if (R() < 0.35) mesh(new THREE.BoxGeometry(dep * 0.9, 0.3, wdt * 0.9), hdr([0xff4060, 0x40c0ff, 0xffffff][Math.floor(R() * 3)], 3), scene, [b.position.x, hgt + 0.2, b.position.z], [0, 0, 0], false);
    z -= wdt + 2 + R() * 6;
  }
  // sky: deep blue night with the warm glow of the city near the horizon
  const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP; void main(){ float h=vP.y; vec3 top=vec3(0.01,0.015,0.04); vec3 hor=vec3(0.11,0.07,0.09);
      vec3 c=mix(hor,top,smoothstep(0.0,0.35,h)); gl_FragColor=vec4(c,1.0); }`,
  }));
  scene.add(sky);
  buildAngel();
  buildTraffic(R);
}
// El Ángel de la Independencia: glorieta, stepped pedestal, column, golden Victory on top.
function buildAngel() {
  const g = new THREE.Group(); g.position.set(0, 0, ANGEL_Z); scene.add(g);
  const stone = std(0xd8d2c4, 0.55), stoneDark = std(0xa9a397, 0.6);
  mesh(new THREE.CylinderGeometry(24, 24, 0.25, 48), std(0x2f3a2c, 0.9), g, [0, 0.12, 0], [0, 0, 0], false);
  mesh(new THREE.CylinderGeometry(9, 10, 1.2, 8), stone, g, [0, 0.6, 0], [0, 0, 0], false);
  mesh(new THREE.CylinderGeometry(7, 7.5, 2.4, 8), stoneDark, g, [0, 2.4, 0], [0, 0, 0], false);
  mesh(new THREE.BoxGeometry(6.4, 6, 6.4), stone, g, [0, 6.6, 0], [0, 0, 0], false);
  mesh(new THREE.CylinderGeometry(2.6, 3.2, 2.2, 16), stone, g, [0, 10.7, 0], [0, 0, 0], false);
  const col = mesh(new THREE.CylinderGeometry(1.45, 1.8, 30, 24), std(0xe8e2d4, 0.45, 0, { emissive: 0xffb36b, emissiveIntensity: 0.08 }), g, [0, 26.8, 0], [0, 0, 0], false);
  for (let i = 0; i < 4; i++) mesh(new THREE.TorusGeometry(1.75 - i * 0.05, 0.12, 8, 32), stone, g, [0, 14 + i * 8, 0], [Math.PI / 2, 0, 0], false);
  mesh(new THREE.CylinderGeometry(2.4, 1.5, 1.6, 16), std(0xe8e2d4, 0.5), g, [0, 42.6, 0], [0, 0, 0], false);
  // the golden Victory: body, wings, raised wreath
  const gold = std(0xffc85a, 0.28, 1.0, { emissive: 0xff9a2a, emissiveIntensity: 0.35 });
  const v = new THREE.Group(); v.position.set(0, 43.4, 0); g.add(v);
  mesh(new THREE.CylinderGeometry(0.25, 0.7, 3.2, 12), gold, v, [0, 1.6, 0], [0, 0, 0], false);
  mesh(new THREE.SphereGeometry(0.32, 16, 12), gold, v, [0, 3.45, 0], [0, 0, 0], false);
  const wingShape = new THREE.Shape(); wingShape.moveTo(0, 0); wingShape.quadraticCurveTo(1.4, 1.2, 2.6, 3.4); wingShape.quadraticCurveTo(1.6, 2.2, 0.2, 1.6); wingShape.lineTo(0, 0);
  const wingG = new THREE.ExtrudeGeometry(wingShape, { depth: 0.12, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 2 });
  for (const s of [-1, 1]) { const w = mesh(wingG, gold, v, [s * 0.2, 1.9, -0.25], [0.15, s > 0 ? 0 : Math.PI, 0], false); }
  mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.6, 8), gold, v, [0.45, 3.8, 0], [0, 0, -0.5], false);
  mesh(new THREE.TorusGeometry(0.35, 0.08, 8, 20), gold, v, [0.85, 4.55, 0], [0, 0.3, 0], false);
  // floodlights on the column
  for (const a of [0, 2.1, 4.2]) {
    const sp = new THREE.SpotLight(0xffc488, 900, 70, 0.35, 0.6, 2); sp.position.set(Math.cos(a) * 12, 1, Math.sin(a) * 12); sp.target.position.set(0, 30, 0);
    g.add(sp, sp.target);
  }
  LIGHTS_ROAD.push({ p: V3(0, 46, ANGEL_Z), c: new THREE.Color(1, 0.8, 0.4), k: 2 });
}
const TRAFFIC = [];
function buildTraffic(R) {
  // a few cars far ahead and in the other lanes: mostly their lights, for bokeh and streaks
  for (let i = 0; i < 18; i++) {
    const lane = [-7.1, -2.4, 2.4, 7.1][Math.floor(R() * 4)];
    const z = lane > 0 ? -300 - R() * 200 : -40 - R() * 260;
    const car = new THREE.Group(); car.position.set(lane, 0, z); scene.add(car);
    const body = mesh(rbox(1.8, 0.75, 4.3, 0.25), std([0x15161a, 0x5b6470, 0x8f1d1d, 0xd8d8d8][i % 4], 0.3, 0.6), car, [0, 0.6, 0]);
    mesh(rbox(1.6, 0.6, 2.2, 0.25), std(0x0b0c10, 0.1, 0.8), car, [0, 1.15, 0.2]);
    for (const s of [-0.65, 0.65]) mesh(new THREE.BoxGeometry(0.35, 0.1, 0.05), hdr(0xff2020, 6), car, [s, 0.75, 2.16], [0, 0, 0], false);
    TRAFFIC.push({ g: car, v: 14 + R() * 6, z0: z, lane });
    LIGHTS_ROAD.push({ p: V3(lane, 0.75, z + 2.2), c: new THREE.Color(1, 0.1, 0.08), k: 0.6, car: TRAFFIC[TRAFFIC.length - 1] });
  }
}

// ───────────────────────────── Lucas, his bike and the truck ─────────────────────────────
const MAT = {};
const BIKE = {}, LUCAS = {}, TRUCK = {};
function buildBike() {
  const g = new THREE.Group(); scene.add(g); BIKE.g = g;   // origin: ground under the wheelbase centre, facing -z
  const black = std(0x101114, 0.55), chrome = std(0xdadde2, 0.15, 1), paint = std(0xc8202a, 0.25, 0.3), rubber = std(0x0c0c0c, 0.85);
  const wheel = (z) => {
    const w = new THREE.Group(); w.position.set(0, 0.31, z); g.add(w);
    mesh(new THREE.TorusGeometry(0.27, 0.065, 12, 36), rubber, w, [0, 0, 0], [0, Math.PI / 2, 0]);
    mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.05, 28), std(0x2a2c30, 0.35, 0.8), w, [0, 0, 0], [0, 0, Math.PI / 2]);
    mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.055, 24), chrome, w, [0.02, 0, 0], [0, 0, Math.PI / 2]);
    return w;
  };
  BIKE.wf = wheel(-0.68); BIKE.wr = wheel(0.66);
  // fork, frame, tank, seat, tail
  for (const s of [-0.09, 0.09]) mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.75, 10), chrome, g, [s, 0.62, -0.58], [-0.42, 0, 0]);
  mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.85, 10), black, g, [0, 0.68, -0.1], [1.15, 0, 0]);
  mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.7, 10), black, g, [0, 0.45, 0.35], [-1.25, 0, 0]);
  const tank = mesh(new THREE.SphereGeometry(0.22, 24, 16), paint, g, [0, 0.9, -0.2], [0, 0, 0]); tank.scale.set(0.9, 0.62, 1.35);
  mesh(rbox(0.26, 0.08, 0.62, 0.035), black, g, [0, 0.86, 0.25], [0.08, 0, 0]);
  mesh(rbox(0.22, 0.12, 0.42, 0.04), paint, g, [0, 0.82, 0.62], [-0.18, 0, 0]);
  mesh(rbox(0.3, 0.24, 0.42, 0.06), std(0x1c1d21, 0.5, 0.3), g, [0, 0.48, -0.02]);         // engine
  mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.6, 12), chrome, g, [0.16, 0.42, 0.45], [1.35, 0, 0]);  // exhaust
  mesh(rbox(0.28, 0.06, 0.4, 0.03), paint, g, [0, 0.62, -0.72], [0.35, 0, 0]);           // front fender
  // headlight, handlebars, mirrors, tail light
  mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.1, 20), black, g, [0, 0.98, -0.78], [Math.PI / 2 - 0.2, 0, 0]);
  mesh(new THREE.CircleGeometry(0.075, 20), hdr(0xfff6e8, 12), g, [0, 0.99, -0.835], [0.2, Math.PI, 0], false);
  mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.7, 8), chrome, g, [0, 1.08, -0.6], [0, 0, Math.PI / 2]);
  for (const s of [-1, 1]) { mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.12, 10), black, g, [s * 0.36, 1.08, -0.6], [0, 0, Math.PI / 2]); mesh(rbox(0.1, 0.06, 0.02, 0.01), chrome, g, [s * 0.3, 1.32, -0.58]); mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.24, 6), chrome, g, [s * 0.3, 1.2, -0.58]); }
  mesh(new THREE.BoxGeometry(0.14, 0.05, 0.03), hdr(0xff1a14, 8), g, [0, 0.83, 0.85], [0, 0, 0], false);

{ // environment for reflections: the street itself, captured once
