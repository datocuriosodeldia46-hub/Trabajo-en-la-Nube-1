<!doctype html>

  canvas { position: absolute; inset: 0; margin: auto; height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// "Lucas": a 35 s vertical short. Every frame is a pure function of time: renderAt(t).
// Paseo de la Reforma at night, a delivery rider, a truck, and the airbag vest in X-ray.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const SC = +(Q.get('scale') ?? 1);   // 0.5 for quick previews
const W = Math.round(1080 * SC), HGT = Math.round(1920 * SC), FPS = 30;
let SUB = +(Q.get('sub') ?? 1);
const SHUTTER = 0.5;

// ───────────────────────────── utilities ─────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * u * (u * (u * 6 - 15) + 10); };
const win = (t, a, b, c, d) => ss(a, b, t) * (1 - ss(c, d, t));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const std = (color, rough = 0.6, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const hdr = (hex, k) => { const c = new THREE.Color(hex); return new THREE.MeshBasicMaterial({ color: new THREE.Color(c.r * k, c.g * k, c.b * k) }); };
const rbox = (w, h, d, r = 0.05, seg = 3) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3));
function mesh(geo, mat, parent, pos = [0, 0, 0], rot = [0, 0, 0], shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = shadow; m.receiveShadow = true; if (parent) parent.add(m); return m;
}
function spline(keys) {   // monotone cubic in time per dimension
  const n = keys.length, T = keys.map(k => k[0]), V = keys.map(k => k.slice(1)), D = V[0].length;
  const M = V.map((v, i) => v.map((_, d) => {
    if (i === 0 || i === n - 1) return 0;
    const a = (V[i][d] - V[i - 1][d]) / (T[i] - T[i - 1]), b = (V[i + 1][d] - V[i][d]) / (T[i + 1] - T[i]);
    if (a * b <= 0) return 0;
    return 3 * (T[i + 1] - T[i - 1]) / ((2 * T[i + 1] - T[i] - T[i - 1]) / a + (T[i + 1] + T[i] - 2 * T[i - 1]) / b);
  }));
  return (t) => {
    if (t <= T[0]) return V[0].slice(); if (t >= T[n - 1]) return V[n - 1].slice();
    let i = 0; while (t > T[i + 1]) i++;
    const h = T[i + 1] - T[i], u = (t - T[i]) / h, u2 = u * u, u3 = u2 * u;
    const a = 2 * u3 - 3 * u2 + 1, b = u3 - 2 * u2 + u, c = -2 * u3 + 3 * u2, e = u3 - u2;
    return V[i].map((_, d) => a * V[i][d] + b * h * M[i][d] + c * V[i + 1][d] + e * h * M[i + 1][d]);
  };
}
function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ───────────────────────────── renderer ─────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, HGT, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.075, 0.052, 0.07), 0.0032);   // night haze over Reforma
const camera = new THREE.PerspectiveCamera(40, W / HGT, 0.05, 900);

// ───────────────────────────── the X-ray look ─────────────────────────────
// A Fresnel hologram: bright green rims, faint fill, additive — the signature of the genre.
const XRAY = [];
function xrayMat(strength = 1, color = [0.35, 1.0, 0.62]) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uK: { value: 0 }, uS: { value: strength }, uC: { value: new THREE.Vector3(...color) } },
    vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vN=normalize(mat3(modelMatrix)*normal); vV=normalize(cameraPosition-w.xyz); gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform float uK, uS; uniform vec3 uC; varying vec3 vN; varying vec3 vV;
      void main(){ float f=1.0-abs(dot(normalize(vN),normalize(vV))); float rim=pow(f,2.2);
        vec3 c=uC*(0.10+1.6*rim)*uS + vec3(0.8,1.0,0.9)*pow(f,7.0)*0.9*uS; gl_FragColor=vec4(c*uK,1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  XRAY.push(m); return m;
}
// Each part keeps its normal look and an X-ray twin that fades in while the "solid" fades out.
const DUAL = [];
function dual(mesh_, strength = 1) {
  const x = new THREE.Mesh(mesh_.geometry, xrayMat(strength)); x.castShadow = false; x.renderOrder = 20;
  mesh_.add(x); DUAL.push({ solid: mesh_, x });
  return mesh_;
}

// ───────────────────────────── the city: Paseo de la Reforma ─────────────────────────────
const ROAD = { half: 9.5, z0: 60, z1: -620 };
const ANGEL_Z = -300;
const DOOR_Z = -205, DOOR_X = -(9.5 + 9);   // the customer's doorway, on the left facade line
const LIGHTS_ROAD = [];   // positions of lamps/car lights → bokeh + wet-road streaks
function buildCity() {
  const R = rng(11);
  // wet asphalt: low roughness so the lights smear across it
  const asphaltTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#2a2c31'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = 30 + R() * 30; g.fillStyle = `rgb(${v},${v},${v + 4})`; g.fillRect(R() * w, R() * h, 1.5, 1.5); }
    for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(10,10,14,0.35)'; g.beginPath(); g.ellipse(R() * w, R() * h, 20 + R() * 60, 8 + R() * 30, R() * 3, 0, 7); g.fill(); }
  });
  asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping; asphaltTex.repeat.set(4, 140);
  const road = mesh(new THREE.PlaneGeometry(2 * ROAD.half, ROAD.z0 - ROAD.z1), std(0xffffff, 0.22, 0.0, { map: asphaltTex, envMapIntensity: 1.6 }), scene, [0, 0, (ROAD.z0 + ROAD.z1) / 2], [-Math.PI / 2, 0, 0], false);
  MAT.road = road.material;
  // lane markings
  const dash = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.15, 3), std(0xf2f2ee, 0.4, 0, { emissive: 0x222222 }), 600);
  const o = new THREE.Object3D(); let n = 0;
  for (const x of [-4.75, 0, 4.75]) for (let z = ROAD.z0; z > ROAD.z1 && n < 600; z -= 9) { o.position.set(x, 0.01, z); o.rotation.set(-Math.PI / 2, 0, 0); o.updateMatrix(); dash.setMatrixAt(n++, o.matrix); }
  dash.count = n; dash.receiveShadow = true; scene.add(dash);
  for (const x of [-ROAD.half + 0.3, ROAD.half - 0.3]) mesh(new THREE.PlaneGeometry(0.14, ROAD.z0 - ROAD.z1), std(0xf2c94e, 0.5), scene, [x, 0.012, (ROAD.z0 + ROAD.z1) / 2], [-Math.PI / 2, 0, 0], false);
  // sidewalks and the tree-lined lateral strips of Reforma
  for (const s of [-1, 1]) {
    mesh(new THREE.BoxGeometry(9, 0.18, ROAD.z0 - ROAD.z1), std(0x3a3a3e, 0.8), scene, [s * (ROAD.half + 4.5), 0.09, (ROAD.z0 + ROAD.z1) / 2], [0, 0, 0], false);
    mesh(new THREE.BoxGeometry(0.25, 0.2, ROAD.z0 - ROAD.z1), std(0x8a8780, 0.6), scene, [s * (ROAD.half + 0.12), 0.1, (ROAD.z0 + ROAD.z1) / 2], [0, 0, 0], false);
  }
  // trees (ahuehuetes / fresnos)
  const trunkG = new THREE.CylinderGeometry(0.16, 0.24, 4, 7), leafG = new THREE.IcosahedronGeometry(1, 1);
  const trunks = new THREE.InstancedMesh(trunkG, std(0x2c2420, 0.9), 220), leaves = new THREE.InstancedMesh(leafG, std(0x1d3a24, 0.85), 660);
  let nt = 0, nl = 0;
  for (const s of [-1, 1]) for (let z = ROAD.z0 - 4; z > ROAD.z1; z -= 13 + R() * 4) {
    if (Math.abs(z - ANGEL_Z) < 40) continue;
    const x = s * (ROAD.half + 2.8 + R() * 1.2);
    o.position.set(x, 2, z); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1); o.updateMatrix(); trunks.setMatrixAt(nt++, o.matrix);
    for (let k = 0; k < 3; k++) { o.position.set(x + (R() - .5) * 1.6, 4.4 + R() * 1.6, z + (R() - .5) * 1.6); const sc = 1.3 + R() * 0.9; o.scale.set(sc, sc * 0.85, sc); o.updateMatrix(); leaves.setMatrixAt(nl++, o.matrix); }
  }
  trunks.count = nt; leaves.count = nl; trunks.castShadow = leaves.castShadow = true; scene.add(trunks, leaves);
  // street lamps (warm) — light pools come from a few real lights near the action
  const poleG = new THREE.CylinderGeometry(0.07, 0.1, 8, 8), headG = rbox(0.9, 0.18, 0.4, 0.06);
  const poleM = std(0x2a2d33, 0.5, 0.6), headM = hdr(0xffd9a0, 9);
  for (const s of [-1, 1]) for (let z = ROAD.z0; z > ROAD.z1; z -= 28) {
    if (Math.abs(z - ANGEL_Z) < 40) continue;
    const x = s * (ROAD.half + 1.0);
    mesh(poleG, poleM, scene, [x, 4, z], [0, 0, 0], false);
    mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 6), poleM, scene, [x - s * 0.8, 7.9, z], [0, 0, Math.PI / 2], false);
    mesh(headG, headM, scene, [x - s * 1.5, 7.85, z], [0, 0, 0], false);
    LIGHTS_ROAD.push({ p: V3(x - s * 1.5, 7.8, z), c: new THREE.Color(1.0, 0.82, 0.55), k: 1 });
  }
  // buildings: concrete office blocks and glass towers; lit shops along the street
  const facade = (glass) => {
    const map = canvasTex(256, 512, (g, w, h) => {
      g.fillStyle = glass ? '#3a4656' : '#5d5a55'; g.fillRect(0, 0, w, h);
      for (let y = 6; y < h; y += 34) for (let x = 4; x < w; x += 32) {
        g.fillStyle = glass ? '#2a3442' : '#24272d'; g.fillRect(x, y, 26, glass ? 30 : 22);
        g.fillStyle = glass ? '#56606e' : '#7a766f'; g.fillRect(x - 4, y + (glass ? 30 : 22), 32, 2);            // sill / transom
      }
      if (glass) { g.fillStyle = '#6b7684'; for (let x = 2; x < w; x += 32) g.fillRect(x, 0, 2, h); }
    });
    const em = canvasTex(256, 512, (g, w, h) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
      for (let y = 6; y < h; y += 34) {
        const floorLit = glass ? R() < 0.3 : R() < 0.7, office = glass && floorLit;
        for (let x = 4; x < w; x += 32) {
          const r = R(); if (!office && (!floorLit || r < 0.45)) continue;
          const warm = !office && r < 0.82, k = 0.45 + R() * 0.55;
          const c = office ? `rgba(225,238,255,${0.7 + R() * 0.3})` : warm ? `rgba(255,${190 + R() * 45 | 0},${120 + R() * 60 | 0},${k})` : `rgba(${120 + R() * 60 | 0},${170 + R() * 60 | 0},255,${k})`;
          const gr = g.createLinearGradient(0, y, 0, y + 22); gr.addColorStop(0, c); gr.addColorStop(1, c.replace(/[\d.]+\)$/, (m) => (parseFloat(m) * 0.55).toFixed(2) + ')'));
          g.fillStyle = gr; g.fillRect(x, y, 26, glass ? 30 : 22);
          if (!glass && R() < 0.35) { g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x, y, 26 * (0.3 + R() * 0.5), 22); }   // half-drawn curtains
          g.fillStyle = '#000'; g.fillRect(x + 12, y, 2, glass ? 30 : 22);                                                  // mullion
        }
      }
    });
    for (const t of [map, em]) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return { map, em };
  };
  const FAC = [facade(false), facade(false), facade(true), facade(true)];
  const SHOPS = ['FARMACIA', 'TACOS', 'CAFÉ', 'PAPELERÍA', 'BANCO', 'TORTAS', 'LAVANDERÍA', 'ÓPTICA', 'HOTEL', 'RESTAURANTE', 'PANADERÍA', 'ABARROTES'];
  const shopTex = (name, hue) => canvasTex(512, 160, (g, w, h) => {
    g.fillStyle = '#050505'; g.fillRect(0, 0, w, h);
    const gr = g.createLinearGradient(0, 48, 0, h); gr.addColorStop(0, 'rgba(255,214,150,0.9)'); gr.addColorStop(1, 'rgba(255,170,90,0.35)');
    g.fillStyle = gr; g.fillRect(8, 52, w - 16, h - 56);
    g.fillStyle = 'rgba(0,0,0,0.85)'; for (let x = 8; x < w; x += 84) g.fillRect(x, 52, 6, h - 52);                  // window frames
    g.fillStyle = 'rgba(0,0,0,0.5)'; for (let i = 0; i < 6; i++) g.fillRect(20 + R() * (w - 60), 90 + R() * 30, 14 + R() * 30, 40);   // shelves / silhouettes
    g.fillStyle = `hsl(${hue},90%,55%)`; g.fillRect(0, 0, w, 44);
    g.fillStyle = '#fff'; g.font = 'bold 34px sans-serif'; g.textAlign = 'center'; g.fillText(name, w / 2, 34);
  });
  for (const s of [-1, 1]) for (let z = ROAD.z0 + 10; z > ROAD.z1 - 40;) {
    const wdt = 16 + R() * 18, dep = 14 + R() * 10, glass = R() < 0.4, hgt = glass ? 50 + Math.pow(R(), 1.5) * 110 : 16 + Math.pow(R(), 2) * 60;
    if (Math.abs(z - ANGEL_Z) < 45) { z -= 30; continue; }
    if (s < 0 && Math.abs(z - wdt / 2 - DOOR_Z) < wdt / 2 + 6) { z -= 14; continue; }   // leave room for the delivery doorway
    const F = FAC[(glass ? 2 : 0) + Math.floor(R() * 2)], map = F.map.clone(), em = F.em.clone();
    for (const t of [map, em]) { t.needsUpdate = true; t.repeat.set(wdt / 48, hgt / 48); t.offset.set(R(), R()); }
    const m = glass ? new THREE.MeshStandardMaterial({ map, color: 0x9aa8b8, roughness: 0.1, metalness: 0.85, emissive: 0xffffff, emissiveMap: em, emissiveIntensity: 1.6 + R() * 0.6 })
                    : new THREE.MeshStandardMaterial({ map, roughness: 0.8, metalness: 0.0, emissive: 0xffffff, emissiveMap: em, emissiveIntensity: 1.3 + R() * 0.8 });
    const bx = s * (ROAD.half + 9 + dep / 2 + R() * 2.5), bz = z - wdt / 2;
    const b = mesh(new THREE.BoxGeometry(dep, hgt, wdt), m, scene, [bx, hgt / 2, bz], [0, 0, 0], false); b.receiveShadow = false;
    const face = bx - s * dep / 2 - s * 0.02;   // the facade that looks onto the street
    if (!glass && R() < 0.8) {
      const name = SHOPS[Math.floor(R() * SHOPS.length)];
      mesh(new THREE.PlaneGeometry(wdt * 0.92, 4.4), new THREE.MeshBasicMaterial({ map: shopTex(name, Math.floor(R() * 360)), color: new THREE.Color(1.6, 1.6, 1.6) }), scene, [face, 2.4, bz], [0, -s * Math.PI / 2, 0], false);
      mesh(new THREE.BoxGeometry(1.4, 0.12, wdt * 0.9), std([0x8a1c1c, 0x1c4a8a, 0x2a6b3a, 0x6b4a1c][Math.floor(R() * 4)], 0.6), scene, [face - s * 0.7, 4.75, bz], [0, 0, s * 0.25], false);   // awning
    } else if (glass) {
      mesh(new THREE.PlaneGeometry(wdt * 0.8, 4.5), hdr(0xdfe8ff, 0.45), scene, [face, 2.4, bz], [0, -s * Math.PI / 2, 0], false);      // lit lobby
    }
    if (R() < 0.35) mesh(new THREE.BoxGeometry(dep * 0.9, 0.3, wdt * 0.9), hdr([0xff4060, 0x40c0ff, 0xffffff][Math.floor(R() * 3)], 3), scene, [bx, hgt + 0.2, bz], [0, 0, 0], false);
    if (glass) for (const k of [0, 1]) mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), hdr(0xff2010, 6), scene, [bx + (k - 0.5) * dep * 0.7, hgt + 0.4, bz], [0, 0, 0], false);   // aviation lights
    z -= wdt + 2 + R() * 6;
  }
  // two skyline landmarks beyond the Ángel: a lattice-braced glass tower and a tall concrete tower with a stepped crown
  {
    const lat = canvasTex(256, 1024, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 6) for (let x = 0; x < w; x += 8) if (R() < 0.25) { g.fillStyle = `rgba(200,225,255,${0.3 + R() * 0.5})`; g.fillRect(x, y, 6, 3); }
      g.strokeStyle = 'rgba(255,190,120,0.9)'; g.lineWidth = 5; for (let y = -h; y < h * 2; y += 256) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + 256); g.moveTo(w, y); g.lineTo(0, y + 256); g.stroke(); } });
    mesh(new THREE.BoxGeometry(46, 235, 46), new THREE.MeshStandardMaterial({ color: 0x202a36, roughness: 0.15, metalness: 0.8, emissive: 0xffffff, emissiveMap: lat, emissiveIntensity: 1.4 }), scene, [48, 117.5, -470], [0, 0.4, 0], false);
    const cf = FAC[1].em.clone(); cf.needsUpdate = true; cf.repeat.set(1, 5);
    const tw = new THREE.MeshStandardMaterial({ color: 0x7a7670, roughness: 0.85, emissive: 0xffffff, emissiveMap: cf, emissiveIntensity: 1.2 });
    mesh(new THREE.BoxGeometry(34, 220, 34), tw, scene, [-60, 110, -430], [0, -0.3, 0], false);
    mesh(new THREE.BoxGeometry(26, 20, 26), tw, scene, [-60, 230, -430], [0, -0.3, 0], false);
    mesh(new THREE.CylinderGeometry(0.4, 0.6, 22, 8), std(0x888888, 0.5), scene, [-60, 251, -430], [0, 0, 0], false);
    mesh(new THREE.SphereGeometry(0.8, 8, 6), hdr(0xff2010, 8), scene, [-60, 262, -430], [0, 0, 0], false);
  }
  // bus shelters with lit ad panels
  const adTex = canvasTex(256, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#ff3d7f'); gr.addColorStop(1, '#3d2aff'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = 'bold 54px sans-serif'; g.fillText('CDMX', 48, 120); g.font = '28px sans-serif'; g.fillText('la ciudad', 60, 170); g.fillText('nunca duerme', 36, 206); g.beginPath(); g.arc(128, 360, 80, 0, 7); g.fillStyle = 'rgba(255,255,255,0.85)'; g.fill(); });
  for (const s of [-1, 1]) for (let z = -70 - (s > 0 ? 60 : 0); z > ROAD.z1; z -= 150) {
    if (Math.abs(z - ANGEL_Z) < 50) continue;
    const x = s * (ROAD.half + 2.2);
    mesh(new THREE.BoxGeometry(1.6, 0.1, 4.2), std(0x2a2d33, 0.4, 0.6), scene, [x, 2.6, z], [0, 0, 0], false);
    for (const dz of [-2, 2]) mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.6, 8), std(0x2a2d33, 0.4, 0.6), scene, [x + s * 0.7, 1.3, z + dz], [0, 0, 0], false);
    mesh(new THREE.BoxGeometry(0.04, 2.0, 4.0), std(0x9fb2c0, 0.05, 0.3, { transparent: true, opacity: 0.25 }), scene, [x + s * 0.75, 1.35, z], [0, 0, 0], false);
    mesh(new THREE.BoxGeometry(0.2, 1.8, 1.0), std(0x1a1c20, 0.5), scene, [x, 1.0, z - 2.6], [0, 0, 0], false);
    mesh(new THREE.PlaneGeometry(0.9, 1.6), new THREE.MeshBasicMaterial({ map: adTex, color: new THREE.Color(2.2, 2.2, 2.2) }), scene, [x - s * 0.11, 1.0, z - 2.6], [0, -s * Math.PI / 2, 0], false);
    mesh(rbox(1.4, 0.08, 3.4, 0.03), std(0x6a6d72, 0.4, 0.7), scene, [x + s * 0.3, 0.5, z], [0, 0, 0], false);   // bench
  }
  // sky: deep blue night with the warm glow of the city near the horizon
  const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP; void main(){ float h=vP.y; vec3 top=vec3(0.01,0.015,0.04); vec3 hor=vec3(0.11,0.07,0.09);
      vec3 c=mix(hor,top,smoothstep(0.0,0.35,h)); gl_FragColor=vec4(c,1.0); }`,
  }));
  scene.add(sky);
  buildAngel();
  buildTraffic(R);
